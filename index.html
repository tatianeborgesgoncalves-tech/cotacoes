<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orçamento Rumos e Rotas</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--nv:#0D1B2A;--ch:#C8B89A;--iv:#F7F4EE;--gr:#555;--bd:#D8D4CC}
body{font-family:'Montserrat',sans-serif;background:#111827;font-weight:400;color:var(--nv)}

/* HEADER */
.hdr{background:var(--nv);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(200,184,154,.1)}
.hdr-logo{height:30px}
.hdr-title{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.3)}
.hdr-btns{display:flex;gap:8px}
.btn{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:10px 20px;cursor:pointer;border:none;transition:background .2s;font-weight:500}
.btn-gold{background:var(--ch);color:var(--nv);font-weight:600}
.btn-gold:hover{background:#b8a88a}
.btn-outline{background:transparent;color:var(--ch);border:1px solid rgba(200,184,154,.4)}
.btn-outline:hover{border-color:var(--ch)}

/* FORM */
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px}
.sec{background:#fff;margin-bottom:3px}
.sec-head{background:var(--nv);padding:14px 22px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.sec-n{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--ch);line-height:1}
.sec-t{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#fff;flex:1;font-weight:500}
.sec-arr{color:var(--ch);font-size:12px;transition:transform .2s}
.sec-arr.open{transform:rotate(0deg)}
.sec-arr.closed{transform:rotate(-90deg)}
.sec-body{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec-body.col1{grid-template-columns:1fr}
.sec-body.hidden{display:none}
.field{display:flex;flex-direction:column;gap:6px}
.field.span2{grid-column:1/-1}
.field label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9A7B5A;font-weight:600}
.field input,.field select,.field textarea{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:400;color:var(--nv);background:var(--iv);border:1px solid var(--bd);padding:10px 12px;outline:none;width:100%;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ch)}
.field textarea{resize:vertical;min-height:70px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:var(--iv);border:1px solid var(--bd);padding:16px;margin-bottom:10px}
.card-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9A7B5A;margin-bottom:12px;font-weight:600}
.row-dyn{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;align-items:end;margin-bottom:8px}
.btn-rm{background:transparent;border:1px solid #ddd;color:#bbb;font-size:15px;padding:7px 10px;cursor:pointer;line-height:1;transition:all .2s}
.btn-rm:hover{border-color:#e57373;color:#e57373}
.btn-add{background:transparent;border:1px dashed rgba(200,184,154,.5);color:#9A7B5A;font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:10px;cursor:pointer;width:100%;margin-top:4px;transition:background .2s;font-weight:500}
.btn-add:hover{background:rgba(200,184,154,.08)}
.btn-foto{font-family:'Montserrat',sans-serif;font-size:10px;background:var(--nv);color:var(--ch);border:none;padding:9px;cursor:pointer;width:100%;height:40px;letter-spacing:2px;text-transform:uppercase;font-weight:500}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;overflow-y:auto;padding:20px}
.overlay.show{display:block}
.overlay-box{max-width:794px;margin:0 auto;background:#fff;box-shadow:0 20px 80px rgba(0,0,0,.5);position:relative}
.overlay-close{position:sticky;top:0;display:block;margin-left:auto;background:var(--ch);color:var(--nv);border:none;font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:10px 18px;cursor:pointer;z-index:10;font-weight:600}

/* PDF DOCUMENT STYLES */
.doc{font-family:'Montserrat',sans-serif;font-weight:400;color:#0D1B2A;background:#fff}
.doc-cover{background:#0D1B2A;padding:30px 40px 0}
.doc-logo{text-align:center;margin-bottom:18px}
.doc-logo img{width:200px;height:auto}
.doc-rule{width:36px;height:1px;background:#C8B89A;margin:0 auto 10px}
.doc-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.4);text-align:center;margin-bottom:5px;font-weight:500}
.doc-dest{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:400;color:#fff;text-align:center;line-height:1.3}
.doc-meta{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.07);margin-top:14px;padding:12px 0}
.doc-meta-item{padding:0 14px;border-right:1px solid rgba(255,255,255,.07)}
.doc-meta-item:last-child{border-right:none}
.dml{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#C8B89A;margin-bottom:3px;font-weight:500}
.dmv{font-size:15px;color:#fff;font-weight:400}
.doc-greet{background:rgba(200,184,154,.1);border-left:3px solid #C8B89A;padding:14px 20px;margin:18px 40px 0}
.doc-hi{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;color:#0D1B2A;margin-bottom:5px}
.doc-msg{font-size:14px;color:#444;line-height:1.75;font-weight:400}
.doc-body{padding:20px 40px 28px}
.dsec{margin-bottom:18px}
.dsec-head{display:flex;align-items:center;gap:4px;padding-bottom:7px;border-bottom:2px solid #E8E4DC;margin-bottom:10px}
.dsn{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;color:#C8B89A}
.dst{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#0D1B2A;font-weight:600}
.igrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:#D8D4CC}
.icell{background:#fff;padding:10px 14px}
.il{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9A7B5A;margin-bottom:3px;font-weight:600}
.iv{font-size:14px;color:#0D1B2A;font-weight:500}
.flt{background:#0D1B2A;padding:13px 17px;margin-bottom:6px}
.flt-rt{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;color:#fff;margin-bottom:8px}
.flt-g{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.08);padding-top:8px}
.fl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(200,184,154,.85);margin-bottom:3px;font-weight:500}
.fv{font-size:14px;color:#fff;font-weight:400}
.hot{background:#F7F4EE;border-left:3px solid #C8B89A;padding:12px 16px;margin-bottom:6px}
.hot-n{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:#0D1B2A;margin-bottom:6px}
.hot-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9A7B5A;margin-bottom:3px;font-weight:600}
.hv{font-size:14px;color:#1a1a1a;font-weight:400}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#C8B89A;background:#0D1B2A;padding:9px 12px;text-align:left;font-weight:600}
.tbl td{font-size:13px;padding:9px 12px;border-bottom:1px solid #E8E4DC;color:#1a1a1a;font-weight:400}
.tbl tr:nth-child(even) td{background:#F7F4EE}
.inv{background:#0D1B2A;padding:14px 18px;margin:12px 0}
.inv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.inv-l{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:500}
.inv-v{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:400;color:#C8B89A}
.inv-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inv-item{background:rgba(255,255,255,.06);padding:10px 14px}
.inv-il{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(200,184,154,.75);margin-bottom:3px;font-weight:500}
.inv-iv{font-size:15px;color:#fff;font-weight:400}
.obs{font-size:13px;color:#444;line-height:1.85;padding:11px 16px;background:#F7F4EE;border-left:3px solid #C8B89A;margin-bottom:7px;font-weight:400}
.obs b{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9A7B5A;display:block;margin-bottom:4px;font-weight:600}
.doc-valid{text-align:center;font-size:13px;color:#555;margin:10px 0 4px;page-break-after:avoid;break-after:avoid}
.doc-foot{background:#0D1B2A;padding:12px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap;min-height:70px;max-height:70px;overflow:hidden;box-sizing:border-box;page-break-inside:avoid;break-inside:avoid}
.doc-foot-left{flex:0 0 auto}
.doc-foot-right{flex:0 0 auto;text-align:right}
.doc-foot-b{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400;color:#fff;letter-spacing:2px;white-space:nowrap}
.doc-foot-b span{color:#C8B89A}
.doc-foot-tag{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-top:1px;font-weight:400;white-space:nowrap}
.doc-foot-n{font-size:10px;color:rgba(255,255,255,.45);line-height:1.5;font-weight:400;white-space:nowrap}

/* PRINT */
@media print{
  body>*{display:none!important}
  #pzone{display:block!important;position:static!important;left:0!important;width:100%!important}
  @page{margin:0;size:A4 portrait}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
}
#pzone{display:none;position:fixed;left:-9999px;top:0;width:794px}
</style>

function tog(id) {
  var b = document.getElementById('b-' + id);
  var a = document.getElementById('a-' + id);
  if (b.classList.contains('hidden')) {
    b.classList.remove('hidden');
    a.innerHTML = '&#9662;';
    a.className = 'sec-arr open';
  } else {
    b.classList.add('hidden');
    a.innerHTML = '&#9656;';
    a.className = 'sec-arr closed';
  }
}

function gv(id) {
  var el = document.getElementById(id);
  if (!el) return '';
  return (el.value || '').trim();
}

function fmtDate(s) {
  if (!s) return '--';
  var p = s.split('-');
  if (p.length !== 3) return '--';
  return p[2] + '/' + p[1] + '/' + p[0];
}

function calcNights() {
  var a = gv('f-ida'), b = gv('f-volta');
  if (!a || !b) return '--';
  var diff = (new Date(b) - new Date(a)) / 86400000;
  return diff > 0 ? String(Math.round(diff)) : '--';
}

function addRow(prefix, type) {
  rc[prefix]++;
  var id = rc[prefix];
  var list = document.getElementById(prefix + '-list');
  var div = document.createElement('div');
  div.className = 'row-dyn';
  div.id = prefix + 'r' + id;
  var f1 = '', f2 = '';
  if (type === 'transfer') { f1 = 'Descrição'; f2 = 'Tipo / Veículo'; }
  else if (type === 'seguro') { f1 = 'Operadora / Plano'; f2 = 'Cobertura'; }
  else if (type === 'passeio') { f1 = 'Passeio / Atividade'; f2 = 'Detalhes'; }
  else if (type === 'aluguel') { f1 = 'Locadora / Categoria'; f2 = 'Período / Detalhes'; }
  if (type === 'transfer') {
    div.style.gridTemplateColumns = '1fr 1fr 1fr 1fr 1fr 36px';
    div.innerHTML =
      '<div class="field"><label>' + f1 + '</label><input id="' + prefix + 'd' + id + '" placeholder="..."></div>' +
      '<div class="field"><label>' + f2 + '</label><input id="' + prefix + 't' + id + '" placeholder="..."></div>' +
      '<div class="field"><label>Data</label><input type="date" id="' + prefix + 'dt' + id + '"></div>' +
      '<div class="field"><label>Horário de Saída</label><input type="time" id="' + prefix + 'hs' + id + '"></div>' +
      '<div class="field"><label>Horário de Chegada</label><input type="time" id="' + prefix + 'hc' + id + '"></div>' +
      '<button class="btn-rm" style="align-self:flex-end" onclick="rmEl(\'' + prefix + 'r' + id + '\')">&#215;</button>';
  } else if (type === 'aluguel') {
    div.style.gridTemplateColumns = '1fr 1fr 1fr 1fr 1fr 36px';
    div.innerHTML =
      '<div class="field"><label>' + f1 + '</label><input id="' + prefix + 'd' + id + '" placeholder="..."></div>' +
      '<div class="field"><label>' + f2 + '</label><input id="' + prefix + 't' + id + '" placeholder="..."></div>' +
      '<div class="field"><label>Data de Retirada</label><input type="date" id="' + prefix + 'dt' + id + '"></div>' +
      '<div class="field"><label>Horário de Retirada</label><input type="time" id="' + prefix + 'hs' + id + '"></div>' +
      '<div class="field"><label>Horário de Devolução</label><input type="time" id="' + prefix + 'hc' + id + '"></div>' +
      '<button class="btn-rm" style="align-self:flex-end" onclick="rmEl(\'' + prefix + 'r' + id + '\')">&#215;</button>';
  } else {
    div.innerHTML =
      '<div class="field"><label>' + f1 + '</label><input id="' + prefix + 'd' + id + '" placeholder="..."></div>' +
      '<div class="field"><label>' + f2 + '</label><input id="' + prefix + 't' + id + '" placeholder="..."></div>' +
      '<button class="btn-rm" onclick="rmEl(\'' + prefix + 'r' + id + '\')">&#215;</button>';
  }
  list.appendChild(div);
}

function rmEl(id) {
  var el = document.getElementById(id);
  if (el) el.parentNode.removeChild(el);
}

function addHosp() {
  hc++;
  var id = hc;
  var list = document.getElementById('hosp-list');
  var div = document.createElement('div');
  div.className = 'card';
  div.id = 'hcard' + id;
  div.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
      '<span class="card-title" style="margin:0">Hospedagem ' + id + '</span>' +
      '<button class="btn-rm" onclick="rmEl(\'hcard' + id + '\')">&#215;</button>' +
    '</div>' +
    '<div class="g3">' +
      '<div class="field"><label>Nome do hotel</label><input id="hn' + id + '" placeholder="Hotel Bessa"></div>' +
      '<div class="field"><label>Endereço / Cidade</label><input id="he' + id + '" placeholder="Lisboa, Portugal"></div>' +
      '<div class="field"><label>Regime</label><input id="hr' + id + '" placeholder="Café da manhã incluído"></div>' +
    '</div>' +
    '<div class="g3">' +
      '<div class="field"><label>Check-in</label><input type="date" id="hci' + id + '"></div>' +
      '<div class="field"><label>Check-out</label><input type="date" id="hco' + id + '"></div>' +

      '<div style="display:flex;align-items:flex-end"><button class="btn-foto" onclick="abrirFotos(' + id + ')">Ver fotos</button></div>' +

}

function abrirFotos(id) {
  var url = gv('hf' + id);
  if (url) window.open(url, '_blank');
}

function getRows(prefix) {
  var out = [];
  var list = document.getElementById(prefix + '-list');
  if (!list) return out;
  var items = list.querySelectorAll('.row-dyn');
  for (var i = 0; i < items.length; i++) {
    var rowId = items[i].id.replace(prefix + 'r', '');
    var d = document.getElementById(prefix + 'd' + rowId);
    var t = document.getElementById(prefix + 't' + rowId);
    var dt = document.getElementById(prefix + 'dt' + rowId);
    var hs = document.getElementById(prefix + 'hs' + rowId);
    var hc = document.getElementById(prefix + 'hc' + rowId);
    if (d && d.value) {
      out.push({d: d.value, t: t ? t.value : '', dt: dt ? fmtDate(dt.value) : '', hs: hs ? hs.value : '', hc: hc ? hc.value : ''});
    }
  }
  return out;
}

function getHotels() {
  var out = [];
  for (var i = 1; i <= hc; i++) {
    var el = document.getElementById('hn' + i);
    if (el && el.value) {
      out.push({
        nome: el.value,
        end: gv('he' + i),
        reg: gv('hr' + i),
        cin: fmtDate(gv('hci' + i)),
        cout: fmtDate(gv('hco' + i)),
        tax: gv('htax' + i),
        obs: gv('ho' + i),
        foto: gv('hf' + i)
      });
    }
  }
  return out;
}

function e(tag, cls, inner) {
  return '<' + tag + (cls ? ' class="' + cls + '"' : '') + '>' + (inner || '') + '</' + tag + '>';
}

document.getElementById('b-draft').addEventListener('click', function() {
  // Collect all current field values
  var fields = {};
  document.querySelectorAll('input, select, textarea').forEach(function(el) {
    if (el.id) fields[el.id] = el.value;
  });

  // Count dynamic rows
  var counts = {
    hc: hc,
    trf: rc.trf,
    seg: rc.seg,
    pas: rc.pas,
    alu: rc.alu
  };

  var dataJson = JSON.stringify({fields: fields, counts: counts});

  // Build complete HTML from scratch using the page source
  var xhr = new XMLHttpRequest();
  xhr.open('GET', window.location.href, false);
  try { xhr.send(); } catch(e) {}

  var restoreScript =
    '<script id="__dr">(function(){' +
    'var data=' + dataJson + ';' +
    'var fields=data.fields;var counts=data.counts;' +
    'function run(){' +
    'for(var i=1;i<=counts.hc-1;i++)addHosp();' +
    'for(var i=0;i<counts.trf;i++)addRow("trf","transfer");' +
    'for(var i=0;i<counts.seg;i++)addRow("seg","seguro");' +
    'for(var i=0;i<counts.pas;i++)addRow("pas","passeio");' +
    'for(var i=0;i<counts.alu;i++)addRow("alu","aluguel");' +
    'Object.keys(fields).forEach(function(id){var el=document.getElementById(id);if(el)el.value=fields[id];});' +
    'var s=document.getElementById("__dr");if(s)s.parentNode.removeChild(s);' +
    '}' +
    'if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",run);}else{run();}' +
    '})();<\/script>';

  // Update the data element in the current DOM before serializing
  var dataEl = document.getElementById('__draft_data__');
  if (!dataEl) {
    dataEl = document.createElement('div');
    dataEl.id = '__draft_data__';
    dataEl.style.display = 'none';
    document.body.appendChild(dataEl);
  }
  dataEl.setAttribute('data-draft', dataJson);

  var html = document.documentElement.outerHTML;
  // Insert restore script right after <body> tag
  html = html.replace(/<body([^>]*)>/, '<body$1>' + restoreScript);

  var blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  var a = document.createElement('a');

// Converte AAAA-MM-DD para DD/MM/AAAA (formato brasileiro)
function fmtDataBR(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  if (p.length !== 3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0];
}
